services:
  # One-shot: create/adjust SQLite schema in the shared volume before web starts.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    image: saasumkm-migrate
    container_name: saasumkm-migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/prod.db}
    volumes:
      - saasumkm-data:/data
    command: >
      sh -c "npx prisma db push --accept-data-loss && chown -R 1001:1001 /data && echo 'schema pushed + chowned'"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: saasumkm-web
    container_name: saasumkm-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-file:/data/prod.db}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
    volumes:
      - saasumkm-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8093:3000"
      - "100.104.68.32:8093:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

volumes:
  saasumkm-data:
